# Build and test every format on the platforms GitHub hosts.
#
# On demand only: Actions tab -> "Build and test" -> Run workflow, or
#   gh workflow run build.yml -f platforms=macos
#
# What runs where, and what it can and cannot prove, is in
# framework/docs/BUILDING.md under "Continuous integration".

name: Build and test

on:
  # TEMPORARY while bringing CI up on the ci branch: workflow_dispatch only
  # works once the file is on the default branch. Removed before merging.
  push:
    branches: [ci]
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to build and test
        type: choice
        options: [macos, linux, windows, all]
        default: macos
      sanitizers:
        description: Also run the asan preset (and tsan on Linux)
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Fetched dependencies live outside the build tree so they can be cached
  # between runs; the pins in Dependencies.cmake key the cache.
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.deps/cpm
  FETCH_DIR: ${{ github.workspace }}/.deps/fetch
  CTEST_OUTPUT_ON_FAILURE: "1"

jobs:
  # ---------------------------------------------------------------------------
  macos:
    if: ${{ contains(fromJSON('["macos","all",""]'), inputs.platforms || '') }}
    name: macOS (${{ matrix.preset }})
    runs-on: macos-15
    permissions:
      contents: write  # TEMPORARY: the ci-results publish step below
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        preset: ${{ fromJSON((inputs.sanitizers || github.event_name == 'push') && '["release","debug","asan"]' || '["release","debug"]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Product identity
        id: product
        run: .github/scripts/product-info.sh >> "$GITHUB_OUTPUT"

      - name: Tools
        run: |
          command -v ninja >/dev/null || brew install ninja
          cmake --version | head -1
          xcrun clang --version | head -1
          sw_vers

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: .deps
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('framework/cmake/Dependencies.cmake', 'framework/cmake/patches/*') }}

      - name: clap-validator
        if: matrix.preset == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/get-clap-validator.sh macos

      - name: Configure
        run: |
          .github/scripts/step.sh configure cmake --preset ${{ matrix.preset }} -G Ninja \
            -DFETCHCONTENT_BASE_DIR="$FETCH_DIR" \
            ${CLAP_VALIDATOR:+-DSUPPLE_CLAP_VALIDATOR="$CLAP_VALIDATOR"}

      - name: Build
        id: build
        run: .github/scripts/step.sh build cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: .github/scripts/step.sh test ctest --preset ${{ matrix.preset }} --timeout 600

      # Everything below exercises the release build as a host would see it.

      - name: Install into the user plug-in folders
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.preset == 'release' }}
        run: |
          cmake --build build/release --target product-install
          ls -la ~/Library/Audio/Plug-Ins/CLAP ~/Library/Audio/Plug-Ins/VST3 ~/Library/Audio/Plug-Ins/Components

      - name: Bundle signatures and architecture
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.preset == 'release' }}
        run: |
          name='${{ steps.product.outputs.name }}'
          for b in "$name.clap" "$name.vst3" "$name.component"; do
            bin="build/release/plugins/$b/Contents/MacOS/$name"
            echo "== $b"
            lipo -info "$bin"
            otool -l "$bin" | grep -A4 LC_BUILD_VERSION | grep -E "minos|sdk" || true
            codesign -dv "build/release/plugins/$b" 2>&1 | grep -E "Signature|flags|Sealed" || true
          done
          # Only the AU is signed as a bundle (macOS refuses to register an
          # AU otherwise); the CLAP and VST3 carry the linker's ad-hoc
          # signature on their binaries, as Ferric's do.
          .github/scripts/step.sh codesign-au codesign --verify --deep --strict --verbose=2 \
            "build/release/plugins/$name.component"
          plutil -p "build/release/plugins/$name.component/Contents/Info.plist"

      - name: auval
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.preset == 'release' }}
        run: |
          auval -a | grep -i '${{ steps.product.outputs.au_manufacturer }}' || true
          .github/scripts/step.sh auval auval -strict -v ${{ steps.product.outputs.au_type }} '${{ steps.product.outputs.au_subtype }}' '${{ steps.product.outputs.au_manufacturer }}'

      - name: pluginval (VST3 and AU)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.preset == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PLUGINVAL="$(.github/scripts/get-pluginval.sh macos)"
          name='${{ steps.product.outputs.name }}'
          .github/scripts/step.sh pluginval-vst3 "$PLUGINVAL" --strictness-level 8 --validate-in-process --timeout-ms 300000 \
            --validate "$HOME/Library/Audio/Plug-Ins/VST3/$name.vst3"
          .github/scripts/step.sh pluginval-au "$PLUGINVAL" --strictness-level 8 --validate-in-process --timeout-ms 300000 \
            --validate "$HOME/Library/Audio/Plug-Ins/Components/$name.component"

      # A real Cocoa window hosting the editor through the CLAP. GitHub's
      # macOS runners are virtual machines: the window server is real, the
      # GPU is paravirtualised. A pass here is evidence, not proof -- the
      # editor still has to be opened on real hardware.
      - name: clap-probe (editor in a Cocoa host window)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.preset == 'release' }}
        run: .github/scripts/clap-probe-mac.sh '${{ steps.product.outputs.name }}'

      - name: gui-preview (OpenGL, 1x and 2x)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.preset == 'release' }}
        run: |
          mkdir -p preview
          .github/scripts/step.sh preview-1x ./build/release/gui-preview preview/editor-1x.png --scale 1
          .github/scripts/step.sh preview-2x ./build/release/gui-preview preview/editor-2x.png --scale 2

      - name: Package
        if: always() && matrix.preset == 'release'
        run: |
          mkdir -p dist
          name='${{ steps.product.outputs.name }}'
          for b in "$name.clap" "$name.vst3" "$name.component"; do
            [ -d "build/release/plugins/$b" ] && ditto -c -k --keepParent "build/release/plugins/$b" "dist/$b.zip"
          done
          cp preview/*.png probe/*.png probe/*.txt dist/ 2>/dev/null || true
          cp -r logs dist/ 2>/dev/null || true
          ls -la dist

      - uses: actions/upload-artifact@v4
        if: always() && matrix.preset == 'release'
        with:
          name: macos-plugins
          path: dist/
          if-no-files-found: ignore

      # TEMPORARY, for bringing CI up: logs, probe output and captures pushed
      # to a throwaway branch where they can be read without the web UI.
      - name: Publish results (temporary)
        if: always() && matrix.preset == 'release' && github.event_name == 'push'
        env:
          TOKEN: ${{ github.token }}
        run: |
          out="$RUNNER_TEMP/results"
          rm -rf "$out" && mkdir -p "$out"
          cp -r logs preview probe "$out/" 2>/dev/null || true
          cp build/release/Testing/Temporary/LastTest.log "$out/logs/ctest-detail.log" 2>/dev/null || true
          cd "$out"
          git init -q -b ci-results-macos
          git -c user.name=ci -c user.email=ci@users.noreply.github.com add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "results for $GITHUB_SHA"
          git push -qf "https://x-access-token:$TOKEN@github.com/$GITHUB_REPOSITORY" ci-results-macos

  # ---------------------------------------------------------------------------
  linux:
    if: ${{ contains(fromJSON('["linux","all",""]'), inputs.platforms || '') }}
    name: Linux (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        preset: ${{ fromJSON(inputs.sanitizers && '["release","debug","asan","tsan"]' || '["release","debug"]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Product identity
        id: product
        run: .github/scripts/product-info.sh >> "$GITHUB_OUTPUT"

      - name: Packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build libx11-dev libxcursor-dev libxrandr-dev \
            libxext-dev libgl1-mesa-dev libgl1-mesa-dri xvfb xauth

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: .deps
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('framework/cmake/Dependencies.cmake', 'framework/cmake/patches/*') }}

      - name: clap-validator
        if: matrix.preset == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/get-clap-validator.sh linux

      - name: Configure
        run: |
          .github/scripts/step.sh configure cmake --preset ${{ matrix.preset }} -G Ninja \
            -DFETCHCONTENT_BASE_DIR="$FETCH_DIR" \
            ${CLAP_VALIDATOR:+-DSUPPLE_CLAP_VALIDATOR="$CLAP_VALIDATOR"}

      - name: Build
        id: build
        run: .github/scripts/step.sh build cmake --build --preset ${{ matrix.preset }}

      - name: Test (under Xvfb, so x11-embedding runs)
        run: .github/scripts/step.sh test xvfb-run -a -s "-screen 0 1920x1080x24" ctest --preset ${{ matrix.preset }} --timeout 600

      - name: pluginval (VST3)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.preset == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PLUGINVAL="$(.github/scripts/get-pluginval.sh linux)"
          .github/scripts/step.sh pluginval xvfb-run -a -s "-screen 0 1920x1080x24" "$PLUGINVAL" --strictness-level 8 \
            --validate-in-process --timeout-ms 300000 \
            --validate "build/release/plugins/${{ steps.product.outputs.name }}.vst3"

      - name: gui-preview (1x and 2x)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.preset == 'release' }}
        run: |
          mkdir -p preview
          .github/scripts/step.sh preview-1x xvfb-run -a -s "-screen 0 1920x1080x24" ./build/release/gui-preview preview/editor-1x.png --scale 1
          .github/scripts/step.sh preview-2x xvfb-run -a -s "-screen 0 1920x1080x24" ./build/release/gui-preview preview/editor-2x.png --scale 2

      - name: Package
        if: always() && matrix.preset == 'release'
        run: |
          mkdir -p dist
          cp -r build/release/plugins/. dist/ 2>/dev/null || true
          cp preview/*.png dist/ 2>/dev/null || true
          cp -r logs dist/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always() && matrix.preset == 'release'
        with:
          name: linux-plugins
          path: dist/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  windows:
    if: ${{ contains(fromJSON('["windows","all",""]'), inputs.platforms || '') }}
    name: Windows (${{ matrix.preset }})
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        preset: [release, debug]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Product identity
        id: product
        run: .github/scripts/product-info.sh >> "$GITHUB_OUTPUT"

      # Puts cl.exe, link.exe and the Windows SDK on PATH for Ninja.
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: .deps
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('framework/cmake/Dependencies.cmake', 'framework/cmake/patches/*') }}

      - name: clap-validator
        if: matrix.preset == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/get-clap-validator.sh windows

      - name: Configure
        run: |
          .github/scripts/step.sh configure cmake --preset ${{ matrix.preset }} -G Ninja \
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl \
            -DFETCHCONTENT_BASE_DIR="$FETCH_DIR" \
            ${CLAP_VALIDATOR:+-DSUPPLE_CLAP_VALIDATOR="$CLAP_VALIDATOR"}

      - name: Build
        id: build
        run: .github/scripts/step.sh build cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: .github/scripts/step.sh test ctest --preset ${{ matrix.preset }} --timeout 600

      - name: pluginval (VST3)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.preset == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PLUGINVAL="$(.github/scripts/get-pluginval.sh windows)"
          .github/scripts/step.sh pluginval "$PLUGINVAL" --strictness-level 8 --validate-in-process --timeout-ms 300000 \
            --validate "build/release/plugins/${{ steps.product.outputs.name }}.vst3"

      - name: Package
        if: always() && matrix.preset == 'release'
        run: |
          mkdir -p dist
          cp -r build/release/plugins/. dist/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always() && matrix.preset == 'release'
        with:
          name: windows-plugins
          path: dist/
          if-no-files-found: ignore
